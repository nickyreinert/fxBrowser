[package]
name = "fxbrowser"
version = "0.1.0"
description = "Local sound effects / loops / jingles library browser"
edition = "2021"

[lib]
name = "fxbrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
calamine = "0.36"
csv = "1"
tokio = { version = "1", features = ["full"] }
rodio = "0.19"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
